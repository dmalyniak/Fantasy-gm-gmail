name: Fantasy GM Emails

on:
  # Runs on a schedule (times are in UTC).
  # Wed 11:00 UTC  ≈ 6:00/7:00 AM Eastern — waiver-day lineup check
  # Sun 15:00 UTC  ≈ 10:00/11:00 AM Eastern — Sunday morning lineup check
  # Thu 22:00 UTC  ≈ 5:00/6:00 PM Eastern — pre-Thursday-Night-Football check
  # Adjust these to whatever times work for you (cron uses UTC, not your local time).
  schedule:
    - cron: '0 11 * * 3'   # Wednesday
    - cron: '0 15 * * 0'   # Sunday
    - cron: '0 22 * * 4'   # Thursday

  # Lets you trigger a run manually from the GitHub Actions tab, to test it.
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python fantasy_gm_email.py
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SEASON: ${{ secrets.SEASON }}
          LEAGUE_NAME: ${{ secrets.LEAGUE_NAME }}
