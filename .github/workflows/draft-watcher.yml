name: Fantasy GM Draft Watcher

# This checks every 2 minutes whether your draft is live and you're
# coming up soon, and emails you a recommendation if so. It exits
# instantly (no email, minimal cost) if no draft is currently active,
# so it's safe to leave running.
#
# Note: GitHub only guarantees schedules run "at least this often" --
# on the free tier, high platform load can occasionally delay a run
# by a few extra minutes beyond the requested interval. In practice
# it's close to on-time, but don't treat 2 minutes as an exact clock.

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  check-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python fantasy_gm_email.py
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SEASON: ${{ secrets.SEASON }}
          LEAGUE_NAME: ${{ secrets.LEAGUE_NAME }}
          MODE: draft
